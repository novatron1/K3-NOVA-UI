name: Local model controller patch

on:
  push:
    branches:
      - agent/local-model-registry-ui

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/local-model-registry-ui
          fetch-depth: 0
      - name: Wire local model inventory and actions into the presentation controller
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/state/use-presentation-controller.ts")
          text = path.read_text(encoding="utf-8")

          old = 'import type { HostPresentationEvent } from "../domain/presentation-events";\n'
          new = 'import type { LocalModelSelection } from "../domain/local-models";\n' + old
          if old not in text:
              raise SystemExit("controller import anchor missing")
          text = text.replace(old, new, 1)

          old = '''  readonly onCancel: () => Promise<void>;\n}'''
          new = '''  readonly onCancel: () => Promise<void>;\n  readonly onScanLocalModels?: () => Promise<void>;\n  readonly onLocalModelSelectionChange?: (\n    selection: LocalModelSelection,\n  ) => Promise<void>;\n}'''
          if old not in text:
              raise SystemExit("controller action anchor missing")
          text = text.replace(old, new, 1)

          old = '''  const voiceStopPending = useRef(false);\n  const voiceStopGeneration = useRef(0);'''
          new = '''  const voiceStopPending = useRef(false);\n  const voiceStopGeneration = useRef(0);\n  const localModelStatusPending = useRef(false);'''
          if old not in text:
              raise SystemExit("controller refs anchor missing")
          text = text.replace(old, new, 1)

          old = '''          runtime.session = connectedSession;\n          if (\n            !runtime.active\n            || runtime.terminated\n            || runtime.sessionTeardownIntent !== null\n          ) {\n            void requestSessionTeardown(\n              runtime,\n              runtime.cancelRequested ? "cancel" : "close",\n            );\n            return;\n          }'''
          new = '''          runtime.session = connectedSession;\n          if (\n            !runtime.active\n            || runtime.terminated\n            || runtime.sessionTeardownIntent !== null\n          ) {\n            void requestSessionTeardown(\n              runtime,\n              runtime.cancelRequested ? "cancel" : "close",\n            );\n            return;\n          }\n\n          const getLocalModels = connectedSession.getLocalModels;\n          if (getLocalModels !== undefined) {\n            void getLocalModels.call(connectedSession).then(\n              (inventory) => {\n                if (runtime.active && !runtime.terminated) {\n                  dispatch({ type: "local_models_updated", inventory });\n                }\n              },\n              () => {\n                if (runtime.active && !runtime.terminated) {\n                  terminate("host_unavailable");\n                }\n              },\n            );\n          }'''
          if old not in text:
              raise SystemExit("controller connection anchor missing")
          text = text.replace(old, new, 1)

          old = '''          dispatch({ type: "host_event", event: validation.event });\n        },\n        onFatalError: terminate,'''
          new = '''          dispatch({ type: "host_event", event: validation.event });\n\n          if (\n            validation.event.type === "message"\n            && validation.event.message.author === "nova"\n            && !localModelStatusPending.current\n          ) {\n            const currentSession = runtime.session;\n            const getStatus = currentSession?.getLocalModelStatus;\n            if (currentSession !== null && getStatus !== undefined) {\n              localModelStatusPending.current = true;\n              void getStatus.call(currentSession).then(\n                (status) => {\n                  if (runtime.active && !runtime.terminated) {\n                    dispatch({\n                      type: "answering_local_model_changed",\n                      value: status.answeringModel,\n                    });\n                  }\n                },\n                () => undefined,\n              ).finally(() => {\n                localModelStatusPending.current = false;\n              });\n            }\n          }\n        },\n        onFatalError: terminate,'''
          if old not in text:
              raise SystemExit("controller event anchor missing")
          text = text.replace(old, new, 1)

          old = '''  const onCancel = useCallback(async (): Promise<void> => {'''
          inserted = '''  const onScanLocalModels = useCallback(async (): Promise<void> => {\n    const runtime = runtimeRef.current;\n    const session = runtime?.session;\n    const scan = session?.scanLocalModels;\n    if (\n      runtime === null\n      || !runtime.active\n      || runtime.terminated\n      || session === null\n      || scan === undefined\n    ) {\n      return;\n    }\n\n    dispatch({ type: "local_model_scan_state_changed", value: "scanning" });\n    try {\n      const inventory = await scan.call(session);\n      if (runtime.active && !runtime.terminated) {\n        dispatch({ type: "local_models_updated", inventory });\n      }\n    } catch {\n      if (runtime.active && !runtime.terminated) {\n        dispatch({ type: "local_model_scan_state_changed", value: "failed" });\n      }\n    }\n  }, []);\n\n  const onLocalModelSelectionChange = useCallback(async (\n    selection: LocalModelSelection,\n  ): Promise<void> => {\n    const runtime = runtimeRef.current;\n    const session = runtime?.session;\n    const setSelection = session?.setLocalModelSelection;\n    if (\n      runtime === null\n      || !runtime.active\n      || runtime.terminated\n      || session === null\n      || setSelection === undefined\n    ) {\n      return;\n    }\n\n    try {\n      const inventory = await setSelection.call(session, selection);\n      if (runtime.active && !runtime.terminated) {\n        dispatch({ type: "local_models_updated", inventory });\n      }\n    } catch {\n      // Keep the previous canonical inventory and selection on failure.\n    }\n  }, []);\n\n''' + old
          if old not in text:
              raise SystemExit("controller cancel anchor missing")
          text = text.replace(old, inserted, 1)

          old = '''    onPermissionDecision,\n    onCancel,\n  }), ['''
          new = '''    onPermissionDecision,\n    onCancel,\n    onScanLocalModels,\n    onLocalModelSelectionChange,\n  }), ['''
          if old not in text:
              raise SystemExit("controller action memo anchor missing")
          text = text.replace(old, new, 1)

          old = '''    onCancel,\n    onDiscardVoiceReview,'''
          new = '''    onCancel,\n    onScanLocalModels,\n    onLocalModelSelectionChange,\n    onDiscardVoiceReview,'''
          if old not in text:
              raise SystemExit("controller dependency anchor missing")
          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
      - name: Commit controller patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/local-model-controller-patch.yml
          git add src/state/use-presentation-controller.ts
          git commit -m "feat: wire local model controls into presentation controller"
          git push origin HEAD:agent/local-model-registry-ui
