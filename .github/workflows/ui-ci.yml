name: NovaMind UI security
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ui-security:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run compile
      - run: npm run lint
      - run: npm run test:unit:run
      - run: npm run build
      - run: npm run test:e2e
