name: Build K3 Nova Android APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VITE_NOVA_HOST_MODE: termux
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install locked web dependencies
        run: npm ci
      - name: Verify web client
        run: npm run verify
      - name: Build Android debug APK
        run: npm run android:apk
      - name: Upload K3 Nova Termux APK
        uses: actions/upload-artifact@v4
        with:
          name: k3-nova-termux-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
