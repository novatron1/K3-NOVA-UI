name: Build K3 Nova Android APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VITE_NOVA_HOST_MODE: remote
      VITE_NOVA_HOST_BASE_URL: ${{ vars.NOVA_HOST_BASE_URL }}
      VITE_NOVA_ALLOW_INSECURE_HOST: ${{ vars.NOVA_ALLOW_INSECURE_HOST }}
      VITE_NOVA_SESSION_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Configure trusted manual connection
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          NOVA_SESSION_TOKEN: ${{ secrets.NOVA_SESSION_TOKEN }}
        run: |
          if [ -z "$VITE_NOVA_HOST_BASE_URL" ]; then
            echo "NOVA_HOST_BASE_URL repository variable is required for a connected APK." >&2
            exit 1
          fi
          if [ -z "$NOVA_SESSION_TOKEN" ]; then
            echo "NOVA_SESSION_TOKEN repository secret is required for a connected APK." >&2
            exit 1
          fi
          echo "VITE_NOVA_SESSION_TOKEN=$NOVA_SESSION_TOKEN" >> "$GITHUB_ENV"
      - name: Install locked web dependencies
        run: npm ci
      - name: Verify web client
        run: npm run verify
      - name: Build Android debug APK
        run: npm run android:apk
      - name: Upload K3 Nova APK
        uses: actions/upload-artifact@v4
        with:
          name: k3-nova-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
