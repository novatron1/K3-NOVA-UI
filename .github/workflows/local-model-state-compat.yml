name: Local model state compatibility patch

on:
  push:
    branches:
      - agent/local-model-registry-ui

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/local-model-registry-ui
          fetch-depth: 0
      - name: Make new model state fields fixture-compatible
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/state/presentation-reducer.ts")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "  readonly localModelControlAvailable: boolean;": "  readonly localModelControlAvailable?: boolean;",
              "  readonly localModels: readonly LocalModelSummary[];": "  readonly localModels?: readonly LocalModelSummary[];",
              "  readonly localModelSelection: LocalModelSelection;": "  readonly localModelSelection?: LocalModelSelection;",
              "  readonly localModelScanState: \"idle\" | \"scanning\" | \"failed\";": "  readonly localModelScanState?: \"idle\" | \"scanning\" | \"failed\";",
              "  readonly answeringModel: AnsweringLocalModel | null;": "  readonly answeringModel?: AnsweringLocalModel | null;",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"missing expected line: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
      - name: Commit compatibility patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/local-model-state-compat.yml
          git add src/state/presentation-reducer.ts
          git commit -m "fix: preserve legacy presentation state fixtures"
          git push origin HEAD:agent/local-model-registry-ui
